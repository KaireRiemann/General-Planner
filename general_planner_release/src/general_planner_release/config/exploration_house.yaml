# General Planner profile: EPICON exploration + General trajectory backend.
# Launch arguments can override both input topics for real-robot deployment.
odometry_topic: /lidar_slam/odom
cloud_topic: /cloud_registered
# Exploration uses the native point-cloud EPICON frontend.
# Remaining legacy frontier settings below serve target_exploration.
global_planning/w_firstnode: 0.2
# Composite next-frontier objective.  All cost-like terms are positive and all
# exploration rewards are subtracted in FastExplorationManager.
viewpoint_score/enable: true
global_planning/composite_candidate_cost_enable: true
global_planning/candidate_travel_weight: 1.0
global_planning/candidate_turn_brake_weight: 1.0
global_planning/candidate_future_return_weight: 0.55
global_planning/candidate_information_gain_weight: 2.0
global_planning/candidate_wait_weight: 1.5
global_planning/candidate_debt_weight: 2.5
global_planning/failed_goal_cooldown: 5.0
global_planning/failed_goal_penalty: 2000.0
# A locally valid trajectory is not necessarily exploration progress. If the
# same ordinary frontier is selected for 12 s without reducing either topology
# travel cost or spatial goal distance, defer it and clear route continuity.
# This closes the "successful short loop forever" liveness gap while allowing
# normal doorway/stair routes to reset the watchdog as their graph cost drops.
global_planning/frontier_progress_watchdog_enable: true
global_planning/frontier_progress_timeout: 12.0
global_planning/frontier_progress_min_cost_drop: 0.75
global_planning/frontier_progress_min_distance_drop: 0.75
global_planning/candidate_gain_saturation: 30.0
global_planning/candidate_wait_saturation: 18.0
global_planning/candidate_debt_saturation: 3.0
global_planning/candidate_return_cost_cap: 12.0
global_planning/candidate_return_horizon: 4
global_planning/frontier_pass_radius: 10.0
global_planning/frontier_pass_exit_margin: 2.0
global_planning/frontier_pass_cooldown: 4.0
global_planning/frontier_pass_debt_increment: 1.0
global_planning/frontier_pass_debt_max: 4.0
viewpoint_param/global_viewpoint_num: 14
viewpoint_param/local_viewpoint_num: 6
# Keep frontier diagnostics, but do not continuously serialize the full
# topology graph.  The previous run ended with 74k skeleton marker endpoints
# and stretched a configured 200 ms update to roughly 400 ms.
view_graph: false
FrontierManager/view_cluster: true
FrontierManager/view_frt: true
# Narrow-passage graph.  The villa door is only about 1.2--1.5 m wide, so the
# outdoor profile's 0.6 m subdivision and 0.61 m minimum bubble can erase the
# entire opening after discretization.
bubble_topo/min_x: 0.35
bubble_topo/min_y: 0.35
bubble_topo/min_z: 0.25
bubble_topo/bubble_min_radius: 0.46
bubble_topo/frontier_bubble_min_radius: 0.46
bubble_topo/init_region_size_x: 4.0
bubble_topo/init_region_size_y: 4.0
bubble_topo/init_region_size_z: 2.0
bubble_topo/cube_discrete_size: 0.30
bubble_topo/odom_node_distance: 2.5
# Odom only needs a well-connected local root, not an A* edge to every
# skeleton node in 27 surrounding regions. Direct visible edges are retained;
# at most twelve nearest occluded candidates receive a full A* fallback.
bubble_topo/odom_connection_candidate_max: 64
bubble_topo/odom_direct_connection_target: 8
bubble_topo/odom_astar_fallback_max: 12
# Per-update A* candidate-edge test budget in updateRemainedConnections.
bubble_topo/edge_test_budget: 48
# ParallelBubbleAstar internally adds another 0.1 m clearance.  Keeping this at
# the 0.45 m hard vehicle radius gives an effective 0.55 m planning clearance
# without declaring a 1.2 m doorway geometrically closed.
bubble_astar/resolution_astar: 0.25
bubble_astar/safe_distance: 0.45
# map param
# Budget of skeleton regions rebuilt per map revision (4x4x2 m each, nearby
# plus oldest pending). Uncapped values let updateSkeleton() exceed 1.5 s on the planning
# thread; the code clamps this to [4, 64].
max_update_region_num: 32
frontier/candidate_dphi: 0.26
frontier/candidate_znum: 3
lidar_perception/fov_up: 52.0
lidar_perception/fov_down: -7.0
lidar_perception/lidar_pitch: 40.0
lidar_perception/fov_viewpoint_up: 48.0
lidar_perception/fov_viewpoint_down: -5.0
lidar_perception/max_ray_length: 36
parallel_astar/update_connection_timeout: 0.010
parallel_astar/insert_node_timeout: 0.010
FrontierManager/cell_size: 0.6
FrontierManager/noise_cell_range: 1
FrontierManager/good_observation_direction_score: 0.65
FrontierManager/good_observation_force_trust_length: 7.0
FrontierManager/good_observation_trust_length: 28.0
FrontierManager/update_length: 36.0 # 大空旷场景扩大更新半径，frontier/viewpoint 更远
FrontierManager/cluster_max_size: 14.0
FrontierManager/cluster_min_size: 0.8 # 对齐 epicon house：保留门洞级小 cluster
FrontierManager/cluster_min_radius: 1.0 # DBSCAN 判断邻居的阈值（与 min_size 0.8 配对）
FrontierManager/cluster_direction_radius: 0.0 # cos(theta) > cluster_direction_radius
FrontierManager/cluster_minmum_point_num: 10
FrontierManager/cluster_min_observation_frames: 2
FrontierManager/cluster_max_fov_edge_ratio: 0.65
FrontierManager/cluster_max_gap_ratio: 0.85
FrontierManager/cluster_match_radius: 3.0
FrontierManager/boundary_ignore_cells: 1
# Indoor/doorway viewpoint sampling.  Heights are offsets from the frontier
# cell, not absolute flight heights.  Sampling only +1.0..+3.5 m forced all
# candidates above low doorway frontiers.
ViewpointManager/sample_pillar_min_height: -1.2
ViewpointManager/sample_pillar_max_height: 1.8
ViewpointManager/sample_pillar_height_layer_num: 5
ViewpointManager/sample_pillar_min_radius: 1.2
ViewpointManager/sample_pillar_max_radius: 5.2
ViewpointManager/sample_pillar_radius_layer_num: 5
ViewpointManager/sample_pillar_circle_sample_num: 8
ViewpointManager/consider_range: 20
ViewpointManager/global_recluster_size: 36
ViewpointManager/view_direction_range: 140.0
ViewpointManager/local_tsp_size: 10
ViewpointManager/top_candidate_num: 2
# Deprecated compatibility parameters. Target navigation grows sparse regions
# from observations and does not use these values as a fixed workspace.
# Coverage defaults to its explicit boxes below; an explicit legacy enable
# still bootstraps a finite coverage workspace.
target_exploration/auto_workspace/enabled: false
target_exploration/auto_workspace/half_extent_xy: 120.0
target_exploration/auto_workspace/below_odom: 2.0
target_exploration/auto_workspace/above_odom: 5.0
target_exploration/auto_workspace/min_xy_extent: 20.0
target_exploration/auto_workspace/min_z_extent: 2.0
target_exploration/auto_workspace/odom_wait_timeout: 5.0

# A target-directed task keeps only forward frontier bridges when at least one
# is available.  It automatically falls back to detours if an obstacle blocks
# every forward option, so this is not a global path monotonicity constraint.
exploration/target_frontier_min_progress: 0.25
exploration/target_cluster_shortlist: 8
exploration/target_goal_lock_remaining_margin: 1.0
# MapManager's persistent topology is a long-range guide, never a bypass of
# the local known-free/Bubble-A*/MINCO safety chain.
exploration/target_topology_guidance_enable: true
exploration/target_topology_query_interval: 1.0
exploration/target_topology_local_prefix_length: 12.0
exploration/target_topology_goal_change_tolerance: 0.5
exploration/target_topology_anchor_min_progress: 0.5
exploration/target_topology_anchor_progress_weight: 1.0
exploration/target_topology_anchor_lateral_penalty: 0.15
exploration/target_topology_anchor_radial_penalty: 0.10
exploration/target_topology_anchor_remaining_penalty: 0.05
exploration/target_topology_anchor_expansion_bonus: 2.0
exploration/target_topology_anchor_candidate_count: 8
exploration/target_topology_anchor_query_attempts: 4
exploration/target_topology_anchor_min_route_length: 1.0
exploration/target_topology_frontier_bias: 0.80
exploration/target_topology_direct_prefix_enable: true
exploration/target_local_preflight_fail_limit: 3
exploration/target_progress_detour_budget: 3
exploration/target_preflight_horizon: 8.0
exploration/target_preflight_soft_defer: 1.5
exploration/target_empty_pool_escape_wait: 2.5
exploration/target_empty_pool_unlock_count: 1
exploration/target_no_progress_timeout: 12.0
exploration/target_escape_min_progress: -1.0
exploration/target_near_goal_remaining: 15.0
exploration/target_spatial_blacklist_radius: 2.5
exploration/target_spatial_blacklist_duration: 8.0

# Exploration volume for the two-storey villa coverage profile.  The boxes
# overlap around the first-floor ceiling/staircase so topology can remain
# connected vertically.  They are deliberately bypassed by the automatic
# target workspace above.
# When enabled, two RViz 3D Nav Goal gestures define the full XYZ diagonal,
# including the lower and upper Z limits. No fixed box is displayed or used;
# planning modules initialize only after the dynamic box is accepted. Set
# enabled=false to use box_0/box_1 below.
dynamic_bounding_box/enabled: false
dynamic_bounding_box/mode: diagonal_3d
dynamic_bounding_box/frame_id: world
dynamic_bounding_box/goal_topic: dynamic_bounding_box/corner_3d
dynamic_bounding_box/reset_topic: dynamic_bounding_box/reset
dynamic_bounding_box/marker_topic: dynamic_bounding_box/markers
# Used only if mode is changed back to footprint.
dynamic_bounding_box/min_z: -0.2
dynamic_bounding_box/max_z: 6.4
dynamic_bounding_box/min_xy_extent: 1.0
dynamic_bounding_box/min_z_extent: 0.5
dynamic_bounding_box/selection_timeout: 0.0
dynamic_bounding_box/line_width: 0.08
box_num: 2
box_0/down: [-20.0, -20.0, -0.2]
box_0/up: [20.0, 20.2, 3.8]
# Keep the upper volume inside the approximately +/-10 m exterior walls.
# This prevents an upstairs frontier seen through the facade from creating an
# exterior climb instead of routing through the staircase.
box_1/down: [-9.5, -9.5, 2.8]
box_1/up: [9.5, 9.5, 6.4]
dead_area_num: 0
# trajectory param
fsm/path_densify_step: 2.5
fsm/adaptive_tight_path_horizon_enable: true
fsm/tight_path_turn_threshold: 2.5
# Indoor paths can accumulate several radians of turn over 7 m.  A shorter
# prefix lets corridor generation advance through a doorway/stair turn in
# multiple safe trajectories instead of requiring one long continuous SFC.
fsm/tight_path_min_horizon: 4.0
fsm/reorient_exit_speed: 0.45
fsm/reorient_timeout: 6.0
fsm/reorient_stop_retry_interval: 0.8
# CAUTION is a low-clearance escape state, not a normal 100 Hz replanning
# state. Rate-limit both braking requests and the more expensive recovery
# corridor/MINCO search so a rejected candidate cannot create a retry storm.
fsm/caution_stop_retry_interval: 0.8
fsm/caution_recovery_retry_interval: 0.75
fsm/max_odom_age: 0.5
# Input pairing: keep approximate_sync for MARSIM; use latest_odom when an
# external simulator cannot provide comparable cloud/odom header timestamps.
fsm/cloud_odom_mode: approximate_sync
fsm/latest_odom_timeout: 0.5
fsm/controlled_reorientation_enable: true
# At near-zero odometry speed, truncate an invalid command into HOLD instead
# of publishing another 0.73 s braking polynomial over a fresh exploration
# trajectory. Repeated map callbacks are rate-limited.
fsm/controlled_stop_min_speed: 0.10
fsm/stationary_hold_retry_interval: 0.75
fsm/plan_failure_retry_delay: 0.20
fsm/plan_failure_refresh_count: 3
# Four stationary goal-refresh cycles (12 local failures with the setting
# above) indicate a spatial local minimum even when clearance itself is safe.
# Relocate about 1.2 m inside known-free space before trying global goals again.
fsm/stationary_relocation_refresh_count: 4
max_traj_len: 26.0
DilateRadiusSoft: 0.60 # narrow-door soft penalty; hard collision radius remains 0.45 m
DilateRadiusHard: 0.45 # collision check threshold
MaxCorridorSize: 7.0
RogMapEnable: true
GeneralCorridorEnable: true
# Shorter seed lines and one extra IRIS expansion improve adjacent-polytope
# overlap on the high-curvature path between rooms and on the staircase.
CorridorLineMaxLength: 2.0
CorridorMinOverlapThreshold: 0.15
CorridorRobotRadius: 0.45
CorridorMaxStartShift: 0.45
CorridorBoxSearchSkipNum: 2
CorridorIrisIterNum: 3
CorridorVirtualGroundHeight: -0.10
CorridorVirtualCeilHeight: 6.40
CorridorUseRogOccPoints: false
RogKnownFreeFallbackToLio: true
MaxVelMag: 5.0
MaxAccMag: 10.0
maxBdrMag: 10000.0
MaxTiltAngle: 1.10 # 最大飞行姿态角度 60°:1.0472 45°:0.7854 30°:0.5236 10°:0.1745
MinThrust: 6.0
MaxThrust: 55.0
VehicleMass: 1.9
GravAcc: 9.8
HorizDrag: 0.70
VertDrag: 0.80
ParasDrag: 0.01
SpeedEps: 0.0001
WeightT: 1500.0
WeightSafeT: 260.0
EnergyWeight: 0.15
# [pos_weight, vel_weight, acc_weight, omg_weight, theta_weight, thrust_weight]
ChiVec: [2.0e+5, 2.0e+4, 8.0e+3, 1.1e+4, 8.0e+4, 3.0e+5]
SmoothingEps: 0.015
IntegralIntervs: 40
RelCostTol: 1.0e-6
DynamicVelocityEnable: false
# The outdoor 3 m/s floor is too aggressive for a low, narrow entrance.
MinSegmentVel: 1.5
# Lower bound used only after an optimized candidate violates the real commit
# dynamics.  It does not reduce the normal 3 m/s cruise floor.
TrajectoryRetryMinVel: 1.0
OpenSegmentVel: 10.0
DynamicVelocityMinClearance: 0.25
DynamicVelocityOpenClearance: 2.2
DynamicVelocityClearanceMargin: 0.45
TurnVelocityEnable: true
TurnLateralAcceleration: 5.0
TurnSoftAngle: 0.35
TurnHardAngle: 1.05
TurnSoftVelocity: 7.0
TurnHardVelocity: 2.0
ReorientationHeadingAngle: 1.75
# Below this speed a heading reversal is planned directly by the optimizer
# instead of braking to a full stop first (hook radius fits the clearance
# bubble). Above it the certified controlled-stop REORIENT is kept.
ReorientationMinSpeed: 1.5
# Only receding-horizon prefixes use a non-zero terminal velocity. True
# observation goals, reversal prefixes, unknown tails, and paths without a
# verified braking backup still end at rest.
NonstopTerminalVelocityEnable: true
NonstopTerminalVelocityRatio: 0.70
NonstopTerminalMinPathLength: 8.0
NonstopTerminalMaxTurnAngle: 0.65
NonstopTerminalMaxYawDelta: 1.0
BackupTrajEnable: true
BackupStartRatio: 0.55
BackupMinStartTime: 1.30
BackupMaxStartTime: 2.4
BackupSampleDt: 0.06
BackupSearchMargin: 5.5
BackupPieceNum: 2
BackupMaxVel: 10.0
BackupMaxAcc: 15.0
ReplanCommitDelay: 0.45
CommitMinDuration: 0.50
CommitMaxDuration: 2.3
CommitSampleDt: 0.05
CommitKnownFreeSafeDistance: 0.45
# The LIO KD cloud is downsampled at 0.1 m while the corridor uses inflated
# ROG voxels.  A 2 cm comparison tolerance removes their boundary quantization
# mismatch; the geometric corridor and live collision radius remain 0.45 m.
SafetyClearanceTolerance: 0.02
CommitBackupTimeBuffer: 0.18
KnownFreeShortLength: 4.0
KnownFreeMediumLength: 10.0
KnownFreeLongLength: 18.0
VelocityShortKnownFree: 2.0
VelocityMediumKnownFree: 4.0
VelocityLongKnownFree: 6.0
SafetyMapQueryStep: 0.20
SafetyMapUnknownAsOccupiedForCommit: true
SafetyMapUnknownAsOccupiedForBackup: true
SafetyMapUnknownAllowedForExplore: true
BrakeAccel: 12.0
PlannerLatency: 0.12
ControlLatency: 0.08
SafetyBrakeMargin: 0.8
CurvatureMinRadius: 0.8
VelocityLogEnable: true
FinishNoFrontierMinCount: 4
FinishNoFrontierMinDuration: 1.5
FinishRequireVehicleSlow: true
FinishSlowSpeed: 0.5
FinishRecheckAfterGoalReached: true
GoalLockEnable: true
GoalSwitchMinInterval: 1.2
GoalSwitchMinImprovement: 2.0
GoalSwitchHighSpeedMultiplier: 1.8
GoalKeepCostRatio: 1.35
GoalLockMatchRadius: 1.0
GoalReachedRadius: 0.35
HighSpeedModeThreshold: 5.0
HighSpeedModeExitThreshold: 3.0
ViewScoreGainWeight: 1.0
ViewScoreProgressWeight: 0.12
ViewScoreVelocityAlignWeight: 2.0
ViewScoreKnownFreeWeight: 0.20
ViewScoreClearanceWeight: 0.45
ViewScoreYawWeight: 0.25
ViewScoreTurnWeight: 1.35
ViewScoreBackupPenalty: 8.0
ViewScoreKnownFreeMaxLen: 25.0
ViewScoreHardGateEnable: true
ViewScoreHardGateMinKnownFreeRatio: 1.0
ViewScoreHardGateMaxTurnAngle: 1.40
ViewScoreHardGateMaxYawDelta: 1.60
ViewScoreHardGateMinClearance: 0.45
ViewScoreTopCandidateNum: 2
EdgeTurnPenaltyWeight: 1.10
EdgeKnownFreePenaltyWeight: 0.45
EdgeBackupPenaltyWeight: 14.0
EdgeYawPenaltyWeight: 0.20
CorridorCruiseEnable: true
CorridorCruiseKnownFreeLength: 18.0
CorridorCruiseMinAlignment: 0.70
CorridorCruiseForwardWeight: 0.40
CorridorCruiseLateralPenalty: 14.0
CorridorCruiseMaxBacktrackDistance: 2.0
CorridorCruiseMinProgress: 4.0
CorridorCruiseMaxGoalDistance: 45.0
#param for yaw opt
yaw_max_vel: 5.0
yaw_rho_vis: 10000.0
yaw_time_fwd: 2.5

# Point-cloud EPICON exploration; trajectory costs/optimizer stay in General Planner.
epicon:
  execution/max_cloud_age: 1.0
  execution/audit_period: 1.0
  execution/goal_failure_limit: 3
  execution/goal_cooldown: 15.0
  execution/goal_exclusion_radius: 0.8
  execution/stall_reselect: 8.0
  execution/stall_timeout: 40.0
  fsm/vaild_num_cube: 10
  fsm/sample_traj_point: 0.1
  fsm/hybrid_search_radius: 15.0
  fsm/unknown_penalty_factor: 1.5
