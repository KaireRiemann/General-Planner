# Single map configuration for every planner_runtime entry point.
# Loaded via map_config. Scene-specific limits are values, not separate profiles.
# One occupancy fusion + BoundaryMap/topology, with navigation and tracking inflation views.
# Task YAMLs contain planning policy only; planner/FSM sampling uses this map's resolution.
rog_map:
  # Geometry: keep historical local occupancy; update only the nearby box below.
  resolution: 0.15
  inflation_resolution: 0.15
  inflation_step: 3  # Navigation / exploration: 0.45 m.
  tracking_inflation_step: 1  # Tracking: 0.15 m over the same occupancy evidence.
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [72.0, 72.0, 15.0]
  map_sliding:
    enable: true
    threshold: 0.3
  fix_map_origin: [0.0, 0.0, 1.5]
  virtual_ground_height: -0.10
  virtual_ceil_height: 8.60

  # All three dimensions are FULL lengths in metres, centred on current odometry.
  # 40 m XY gives +/-20 m for the 8 m navigation / 3 s tracking horizons.
  # Rays outside this box are clipped to free-space evidence, not occupied hits.
  raycasting:
    enable: true
    local_update_box: [40.0, 40.0, 6.0]
    ray_range: [0.50, 30.0]  # radial limits; the update box also clips each ray.
    batch_update_size: 1
    # Frame-deduplicated hit/miss fusion clears departed objects when reobserved.
    p_hit: 0.90
    p_miss: 0.35
    p_min: 0.12
    p_max: 0.97
    p_occ: 0.85
    p_free: 0.40
    unk_thresh: 1.0
  point_filt_num: 1  # keep all input points; no extra thinning here.
  intensity_thresh: -10

  # GlobalMapRuntime supplies the filtered cloud and odometry. Never subscribe twice.
  ros_callback:
    enable: false
  load_pcd_en: false
  frontier_extraction_en: false
  esdf:
    enable: false
    resolution: 0.15
    local_update_box: [12.0, 12.0, 4.0]

  visualization:
    enable: true
    frame_id: world
    time_rate: 1.0
    frame_rate: 0
    range: [30.0, 30.0, 5.0]
    pub_unknown_map_en: false

# World-lifetime topology; individual task modes only choose how to query it.
global_topology:
  enabled: true
  # Topology is world-lifetime state: HOLD and planner handovers never stop
  # maintenance.  The worker instead consumes only dirty regions inside the
  # fresh odometry-centred local window below.
  # Keep a maximum-clearance core and boundary portals for each observed-free
  # component. Nodes and edges remain collision-validated, while open rooms
  # need only a few representatives instead of one node per 0.45 m cell.
  construction_mode: persistent_bubble_skeleton
  planar_mode: false
  navigation_altitude: 1.6
  frame_id: world
  topic: /planner/global_topology
  # Independent semantic snapshot. A point is expandable only if one of its
  # region-face portals has no active connection to another topology region.
  expansion_topic: /planner/world/topology_expansion_points
  expansion_publish_period: 0.50
  # Dirty updates are coalesced and map revisions remain available immediately
  # to local safety. The immutable query snapshot is copied at 2 Hz.
  update_period: 0.10
  publish_period: 0.50
  # These bounds prioritize long-range connectivity and memory. Local planners
  # still validate every guide prefix and final trajectory at native ROG
  # resolution before committing a command.
  region_size: 4.0
  sample_spacing: 0.80
  min_clearance: 0.40
  max_clearance: 2.5
  candidate_separation: 1.50
  stable_match_distance: 1.00
  connection_radius: 6.00
  edge_sample_spacing: 0.20
  dirty_padding: 2.50
  bubble_overlap_margin: 0.10
  unknown_as_free: false
  # Odom arrives continuously from GlobalMapRuntime. Without a fresh focus,
  # defer the persistent dirty backlog rather than rebuilding remote history.
  require_fresh_focus: true
  focus_timeout: 0.50
  # Full metric dimensions of the local dirty-region AABB. A 4 m topology
  # region is consumed only when it intersects this box; non-intersecting
  # regions remain queued until the vehicle approaches them.
  local_update_window_x: 5.0
  local_update_window_y: 5.0
  local_update_window_z: 3.0
  # A zero-degree candidate is excluded from topology publication and route
  # search. Every component that has a validated edge remains visible; the
  # current robot attachment is checked only when a route is queried.
  # A component contributes its core plus only the portals needed to preserve
  # room, corridor and vertical connectivity. This hard cap is the primary
  # memory bound for the persistent graph.
  max_nodes_per_region: 12
  max_bubbles_per_region: 192
  max_neighbors: 8
  max_regions_per_update: 4
  # SearchSnapshot is immutable for readers and refreshed at publish_period,
  # avoiding per-sensor copying of a world-lifetime graph.
  snapshot_every_update: false
  node_scale: 0.22
  edge_scale: 0.06

global_map:
  max_odom_age: 0.5
  max_cloud_age: 0.50
  odom_queue: 50
  cloud_queue: 1
  sync_queue: 20
