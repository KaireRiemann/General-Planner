# Tracking planning aligned with zip Elastic-Tracker:
# 20 Hz, 30 ms stamp, unknown-as-free occupancy, keep last traj on replan fail,
# collision validcheck (1 s), vmax/amax 3/6, observation ring 2.5 m.
fsm:
  replan_rate: 20.0
  task_timeout: 0.5
  tracking_target_odom_topic: /tracking/target_odom
  tracking_target_prediction_topic: /tracking/target_prediction
  tracking_use_target_prediction_path: false
  tracking_prediction_horizon: 3.0
  tracking_prediction_dt: 0.2
  tracking_prediction_use_kinodynamic: true
  tracking_prediction_accel: 3.0
  tracking_prediction_vmax: 4.0
  tracking_prediction_rho_accel: 1.0
  tracking_prediction_max_time: 0.1
  tracking_target_exclusion_xy_radius: 0.8
  tracking_target_exclusion_z_radius: 0.8
  tracking_static_position_epsilon: 0.05
  tracking_static_velocity_epsilon: 0.05
  tracking_static_yaw_epsilon: 0.05
  tracking_static_replan_remaining_time: 0.8
  tracking_static_task_position_epsilon: 0.12
  tracking_static_task_velocity_epsilon: 0.1
  tracking_static_prediction_filter_velocity_epsilon: 0.08
  tracking_static_safety_check_horizon: 1.5
  tracking_static_safety_check_dt: 0.12
  tracking_static_replan_log_period: 1.0
  tracking_plan_from_rest_max_failures: 4
  tracking_plan_from_rest_failure_backoff: 0.5
  tracking_plan_from_rest_limited_backoff: 2.0
  tracking_static_finish_on_plan_failure: false

general_planner:
  tracking:
    nominal_horizon: 3.0
    sample_dt: 0.2
    frontend_budget: 0.20
    solver_budget: 0.08
    solver_iterations: 1000
    max_vel: 3.0
    max_acc: 6.0
    yaw_rate_limit: 2.0
    yaw_acceleration_limit: 3.0
    corridor_bound_dis: 2.0
    corridor_line_max_length: 2.0
    obs_skip_num: 1
    iris_iter_num: 2
    ellipsoid_optimizer: classic
    ellipsoid_optimizer_fallback: false
    replan_forward_dt: 0.03
    distance: 2.5
    distance_tolerance: 0.3
    height_offset: 1.0
    height_tolerance: 0.3
    visibility_angle_clearance: 0.8
    weight_tracking: 1000.0
    weight_visible_region: 10000.0
    min_commit_duration: 0.5
    keep_old_horizon: 1.0
    keep_old_min_remaining: 0.35
    keep_old_safety_dt: 0.05
    unknown_as_occupied: false
    use_visible_region: true
    # Query-time cylinder used only by tracking occupancy queries.
    # Shared ROG is not rewritten; subtract the target cloud before mapping.
    target_exclusion_xy_radius: 0.8
    target_exclusion_z_radius: 0.8
    # Visualization only; image framing is not an additional commit veto.
    fov_horizontal_deg: 75.178
    fov_vertical_deg: 60.0
    fov_range: 8.0

traj_opt:
  tracking_traj:
    block_energy_cost: false
    opt_accuracy: 0.0001
    integral_reso: 16
    smooth_eps: 0.01
    penna_t: 100.0
    penna_pos: 10000.0
    penna_vel: 1000.0
    penna_acc: 1000.0
