output_frame: world
# Sensor age includes inference/transport delay; receipt gap bounds missed detections.
max_observation_age: 1.0
max_detection_gap: 0.65
fresh_observation_age: 0.25
confirmations: 3
sync_tolerance: 0.15
max_position_std: 2.0
# Acquiring uses max_position_std; a tracked target has a separate loss limit.
loss_position_std: 2.5
height_relative_std: 0.10
max_range: 30.0
object_height: 1.4
# cam2body_R/p are loaded from camera_config; ground_z/center height are launch args.
