# ROG-Map backend used by the HighSpeedExp frontend in General Planner.
rog_map:
  esdf:
    enable: false
    resolution: 0.15
    local_update_box: [12.0, 12.0, 4.0]

  load_pcd_en: false
  map_sliding:
    enable: true
    threshold: 0.3
  fix_map_origin: [0.0, 0.0, 1.5]
  frontier_extraction_en: false

  ros_callback:
    enable: false
    cloud_enable: false
    odom_timeout: 0.10

  visualization:
    enable: true
    pub_unknown_map_en: false
    frame_id: world
    time_rate: 1.0
    frame_rate: 0
    range: [30.0, 30.0, 5.0]

  resolution: 0.15
  inflation_resolution: 0.15
  unk_inflation_en: false
  unk_inflation_step: 1
  # Shared world map for every runtime mode.  Keep the navigation safety
  # margin aligned with click_real_highspeed (3 * 0.15 m = 0.45 m).
  inflation_step: 3
  intensity_thresh: -10
  map_size: [72.0, 72.0, 8.0]
  point_filt_num: 1
  # Legacy configuration only. Local fusion must never depend on temporal
  # confirmation; persistent LIO geometry uses ROG occupancy probability.
  temporal_filter:
    enable: false
    voxel_size: 0.20
    min_observations: 10
    min_observation_span: 0.90
    min_observer_baseline: 0.0  # Deprecated: motion must never gate map bootstrap.
    max_observation_gap: 0.45
    max_voxels: 250000

  raycasting:
    enable: true
    batch_update_size: 1
    unk_thresh: 1.0
    # Restore prompt local obstacle insertion. Per-frame dedup prevents a
    # dense scan from counting as hundreds of independent hits; measured
    # misses clear old occupancy without a temporal admission gate.
    p_hit: 0.90
    p_miss: 0.35
    p_min: 0.12
    p_max: 0.97
    p_occ: 0.85
    p_free: 0.40
    ray_range: [0.50, 60.0]
    local_update_box: [70.0, 70.0, 6.0]

  virtual_ground_height: -0.10
  # The villa has a second navigable floor between z=3.0 and z=6.0.
  virtual_ceil_height: 6.40
