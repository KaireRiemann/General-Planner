dynamic_bounding_box/line_width: 0.08

box_num: 1
box_0/down: [-10.0, -6.0, -0.2]
box_0/up: [182.0, 150.2, 3.8]
dead_area_num: 0
max_traj_len: 10.0
DilateRadiusSoft: 0.6
DilateRadiusHard: 0.5
MaxCorridorSize: 3.5
MaxVelMag: 4.0
maxBdrMag: 10000.0
MaxTiltAngle: 0.5
MinThrust: 15.0
MaxThrust: 22.0
VehicleMass: 1.9
GravAcc: 9.8
HorizDrag: 0.70
VertDrag: 0.80
