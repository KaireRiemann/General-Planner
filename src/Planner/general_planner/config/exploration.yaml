SpeedEps: 0.0001
WeightT: 2000.0
ChiVec: [2.0e+5, 1.5e+4, 1.0e+4, 1.0e+5, 1.0e+5]
SmoothingEps: 0.015
IntegralIntervs: 32
RelCostTol: 1.0e-6
yaw_max_vel: 4.0

# Native algorithm.xml and FSM defaults.
bubble_astar/allocate_num: 1000000
bubble_astar/lambda_heu: 100.0
bubble_astar/debug: false
bubble_astar/resolution_astar: 0.2
epicon/fsm/vaild_num_cube: 10
epicon/fsm/sample_traj_point: 0.1
epicon/fsm/hybrid_search_radius: 15.0
epicon/fsm/unknown_penalty_factor: 1.5
fsm/replan_time: 0.2
fsm/replan_time_after_traj_start: 0.5
fsm/replan_time_before_traj_end: 0.5
fsm/global_path_update_min_interval: 0.2

# General runtime ingress and task-command integration.
exploration/mission_mode: coverage
coverage_guidance/mode: 'off'
exploration/use_lkh: true
exploration/tsp_dir: /tmp
RogMapEnable: true
fsm/cloud_odom_mode: latest_odom
fsm/latest_odom_timeout: 0.5
fsm/max_odom_age: 0.5
fsm/cloud_subscriber_queue: 1
fsm/odom_subscriber_queue: 50
fsm/auto_trigger: false
replan_time: 0.2
heartbeat_timeout: 1.5
