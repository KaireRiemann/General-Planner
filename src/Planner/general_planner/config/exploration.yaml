fsm:
  task_mode: "exploration"
  auto_start: true
  click_goal_en: false
  click_goal_topic: "/goal"
  click_height: 1.5
  click_yaw_en: true
  task_planner_en: false
  task_mode_topic: "/planning/task_mode"
  replan_rate: 5.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

general_planner:
  backup_traj_en: false
  esdf_traj_en: false
  plain_traj_en: true
  esdf_safe_distance: 0.35
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: true
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  ellipsoid_optimizer: classic
  ellipsoid_optimizer_fallback: false
  obs_skip_num: 2
  replan_forward_dt: 0.2
  planning_horizon: 14.0
  sensing_horizon: -1
  receding_dis: 7.0
  robot_r: 0.2
  frontend_astar_time_out: 0.06
  over_wall_search_en: true
  over_wall_max_climb: 3.0
  over_wall_height_step: 0.3
  over_wall_min_blocked_span: 0.8
  over_wall_min_progress_gain: 0.5
  over_wall_forward_ratio: 0.9
  unknown_goal_reveal_en: true
  yaw_dot_max: 3.0
  yaw_mode: 1
  mpc_horizon: 15

  exploration_enable: true
  exploration_manager_enable: true
  exploration_global_box_enable: true
  exploration_global_box_min: [-60.0, -60.0, 0.0]
  exploration_global_box_max: [60.0, 60.0, 3.0]
  exploration_manager_frontier_merge_radius: 2.0
  exploration_manager_frontier_record_ttl: 120.0
  exploration_manager_frontier_failure_ttl: 15.0
  exploration_manager_frontier_covered_radius: 2.0
  exploration_manager_max_frontier_records: 1024
  exploration_manager_coverage_resolution: 1.0
  exploration_manager_coverage_radius: 10.0
  exploration_manager_coverage_z_half: 1.5
  exploration_manager_max_coverage_cells: 200000
  exploration_manager_unknown_gain_radius: 4.0
  exploration_manager_unknown_gain_resolution: 0.8
  exploration_manager_unknown_gain_score_weight: -0.04
  exploration_manager_revisit_score_weight: 2.0
  exploration_manager_covered_score_weight: 20.0
  exploration_manager_stale_frontier_score_weight: 0.25
  exploration_manager_committed_frontier_score_weight: 8.0
  exploration_manager_recent_commit_score_weight: 14.0
  exploration_manager_recent_commit_time_window: 10.0
  exploration_manager_max_commits_before_cooldown: 3
  exploration_manager_overcommit_cooldown: 8.0
  exploration_manager_completion_scan_resolution: 1.0
  exploration_manager_completion_max_unknown_voxels: 40
  exploration_manager_completion_min_coverage_ratio: 0.70
  exploration_manager_completion_stable_cycles: 3
  exploration_manager_completion_max_active_frontiers: 0
  exploration_frontier_source: "auto"
  exploration_frontier_search_radius: 16.0
  exploration_frontier_cluster_radius: 1.5
  exploration_frontier_sample_resolution: 0.6
  exploration_frontier_subcluster_size: 4.0
  exploration_min_frontier_cluster_size: 12
  exploration_min_frontier_area: 0.12
  exploration_min_frontier_extent: 0.4
  exploration_min_unknown_neighbor_count: 12
  exploration_max_raw_frontier_points: 8192
  exploration_max_frontier_cells: 3072
  exploration_max_frontier_clusters: 64
  exploration_max_subclusters_per_cluster: 16
  exploration_frontier_manager_enable: true
  exploration_frontier_manager_max_records: 768
  exploration_frontier_manager_match_radius: 2.2
  exploration_frontier_manager_stale_time: 10.0
  exploration_frontier_manager_dormant_time: 7.0
  exploration_frontier_manager_covered_unknown_radius: 1.8
  exploration_frontier_manager_min_changed_fraction: 0.2
  exploration_frontier_manager_selection_penalty: 7.5
  exploration_frontier_manager_recent_selection_penalty: 16.0
  exploration_frontier_manager_recent_selection_window: 12.0
  exploration_frontier_manager_no_view_threshold: 2
  exploration_viewpoint_min_distance: 2.0
  exploration_viewpoint_max_distance: 8.0
  exploration_viewpoint_height_offset: 0.0
  exploration_viewpoint_safe_distance: 0.45
  exploration_viewpoint_yaw_sample_num: 12
  exploration_viewpoint_radius_sample_num: 4
  exploration_viewpoint_use_normal_sampling: true
  exploration_viewpoint_normal_angle: 1.1
  exploration_viewpoint_z_sample_num: 1
  exploration_viewpoint_z_min: 0.0
  exploration_viewpoint_z_max: 0.0
  exploration_min_visible_frontier_cells: 6
  exploration_min_visible_frontier_ratio: 0.08
  exploration_max_candidate_num: 120
  exploration_max_candidates_per_frontier_cluster: 8
  exploration_candidate_separation_distance: 1.5
  exploration_max_astar_checks: 12
  exploration_min_direct_reachable_before_astar: 8
  exploration_max_astar_checks_per_frontier: 2
  exploration_max_reachable_candidate_num: 32
  exploration_max_gain_rays: 96
  exploration_gain_ray_length: 5.0
  exploration_gain_ray_step: 0.2
  exploration_astar_time_out: 0.025
  exploration_astar_total_time_budget_ms: 40.0
  exploration_astar_failure_cache_ttl: 4.0
  exploration_yaw_policy: "velocity"
  exploration_weight_travel: 0.35
  exploration_weight_yaw: 0.5
  exploration_weight_curvature: 0.8
  exploration_weight_info_gain: -2.4
  exploration_weight_unknown_risk: 1.0
  exploration_weight_progress: -1.25
  exploration_weight_short_goal: 10.0
  exploration_information_gain_saturation: 220.0
  exploration_min_information_gain: 2.0
  exploration_min_goal_distance: 6.0
  exploration_preferred_goal_distance: 12.0
  exploration_goal_switch_min_score_improvement: 0.45
  exploration_goal_reached_distance: 0.5
  exploration_unknown_as_occupied_for_motion: true
  exploration_require_line_free_to_frontier: true
  exploration_use_astar_cost: true
  exploration_use_atsp: true
  exploration_atsp_solver: "fy_node_lkh"
  exploration_atsp_work_dir: "/tmp/general_planner_atsp"
  exploration_atsp_external_command: ""
  exploration_atsp_time_budget_ms: 50
  exploration_atsp_cost_scale: 100
  exploration_atsp_max_candidate_num: 24
  exploration_use_frontier_memory: true
  exploration_frontier_memory_max_records: 256
  exploration_frontier_memory_ttl: 60.0
  exploration_frontier_memory_failure_ttl: 12.0
  exploration_frontier_memory_failure_block_radius: 2.0
  exploration_frontier_memory_covered_radius: 0.8
  exploration_frontier_memory_recovery_min_distance: 0.8
  exploration_use_coverage_grid: true
  exploration_coverage_grid_resolution: 1.0
  exploration_coverage_revisit_radius: 0.8
  exploration_coverage_revisit_time_window: 4.0
  exploration_coverage_revisit_penalty_weight: 0.25
  exploration_coverage_grid_max_cells: 4096
  exploration_use_topological_memory: true
  exploration_topology_max_nodes: 256
  exploration_topology_max_edges: 512
  exploration_topology_node_merge_radius: 1.0
  exploration_topology_node_blacklist_ttl: 12.0
  exploration_topology_edge_blacklist_ttl: 12.0
  exploration_topology_recovery_min_distance: 1.0
  exploration_topology_recovery_max_distance: 8.0
  exploration_nhbp_enable: true
  exploration_nhbp_decision_history: 16
  exploration_nhbp_blacklist_ttl: 12.0
  exploration_nhbp_min_commit_time: 1.8
  exploration_nhbp_min_progress_distance: 0.3
  exploration_nhbp_switch_margin: 0.45
  exploration_nhbp_max_switches: 4
  exploration_nhbp_no_progress_time: 3.0
  exploration_nhbp_recovery_enable: true
  exploration_local_trap_detection_enable: true
  exploration_local_trap_repeat_threshold: 4
  exploration_local_trap_cluster_threshold: 2
  exploration_local_trap_astar_threshold: 12
  exploration_local_trap_min_information_gain: 800.0
  exploration_local_trap_same_region_radius: 2.5
  exploration_local_trap_cooldown: 4.0
  exploration_print_log: true

traj_opt:
  switch:
    save_log_en: true
    print_optimizer_log: false

  boundary:
    max_vel: 3.0
    max_acc: 3.5
    max_jerk: 80.0
    max_omg: 2.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5

  esdf_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 16
    smooth_eps: 0.01
    init_profile_vel_ratio: 1.0
    init_duration_scale: 1.0
    penna_t: 40000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_attract: 1.0e+4
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5

  plain_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 16
    smooth_eps: 0.01
    init_profile_vel_ratio: 1.0
    init_duration_scale: 1.0
    terminal_vel_ratio: 0.95
    penna_t: 40000.0
    penna_pos: 1.0e+7
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_attract: 2.0e+3
    penna_guide_vel: 1.0e+2
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81

astar:
  map_voxel_num: [500, 500, 100]
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false

rog_map:
  resolution: 0.1
  inflation_resolution: 0.2
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [80, 80, 8]
  fix_map_origin: [0, 0, 1.5]
  frontier_extraction_en: true
  virtual_ceil_height: 5.5
  virtual_ground_height: -0.1
  load_pcd_en: false

  map_sliding:
    enable: true
    threshold: 0.3

  esdf:
    enable: false
    resolution: 0.2
    local_update_box: [16, 16, 4]

  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0

  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [24, 24, 4]
    frame_id: "world"
    pub_unknown_map_en: true

  intensity_thresh: -10
  point_filt_num: 1

  raycasting:
    enable: true
    batch_update_size: 1
    local_update_box: [36, 36, 5]
    ray_range: [0.5, 24.0]
    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0
