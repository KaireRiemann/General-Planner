# Loaded after the base/scene configs by the release exploration entries and
# planner_runtime.launch. Keep the source and release copies identical.
# Native point-cloud coverage reads epicon/*; indoor_frontier/* below is
# consumed by the shared map frontend and does not configure EPICON.
# Indoor profile verified with recorded scans; full-house flight remains
# subject to doorway clearance and closed-loop validation.

# Preserve small doorway frontiers and split nearby room boundaries sooner.
# Six points still gate the clustering input; retain noise filtering.
# 0.18 m keeps the recorded doorway detail with substantially cheaper full
# audits than 0.15 m. This changes detection, not collision clearance.
epicon/FrontierManager/cell_size: 0.18
epicon/FrontierManager/cluster_min_radius: 0.4
epicon/FrontierManager/cluster_min_size: 0.3
epicon/FrontierManager/cluster_max_size: 2.5
epicon/FrontierManager/cluster_minmum_point_num: 6
epicon/ViewpointManager/sample_pillar_min_height: -1.2
epicon/ViewpointManager/sample_pillar_max_height: 1.2
epicon/ViewpointManager/sample_pillar_height_layer_num: 8
epicon/ViewpointManager/sample_pillar_min_radius: 0.7
epicon/ViewpointManager/sample_pillar_max_radius: 2.5
epicon/ViewpointManager/sample_pillar_radius_layer_num: 6
epicon/ViewpointManager/sample_pillar_circle_sample_num: 24
# Candidate sampling only. The adapter clamps this above graph/planning
# clearance; physical collision and execution clearances stay unchanged.
# Prefer the native 0.9 m margin among connected, observable candidates.
# A narrow room may use a 0.68 m candidate if it has no such viewpoint;
# corridor and trajectory certification still apply independently.
epicon/ViewpointManager/min_clearance: 0.68
epicon/ViewpointManager/preferred_clearance: 0.9
# Native coverage reads these namespaced values, not the legacy launch
# arguments bubble_astar_resolution / bubble_topo_cube_discrete_size.
epicon/bubble_astar/resolution_astar: 0.2
epicon/bubble_topo/cube_discrete_size: 0.25
# Fast connectors remain cheap. A disconnected odometry root may retry with
# 10 ms, under a 30 ms total connection budget. Batch insertion stays at 2 ms.
epicon/parallel_astar/update_connection_timeout: 0.002
epicon/parallel_astar/insert_node_timeout: 0.002
epicon/parallel_astar/odom_retry_timeout: 0.01
epicon/parallel_astar/odom_connection_budget: 0.03
epicon/parallel_astar/odom_max_connections: 3

# Shared map frontend profile.

indoor_frontier/update_length: 22.0
indoor_frontier/cluster_min_size: 0.8
indoor_frontier/cluster_min_radius: 1.0
indoor_frontier/cluster_minmum_point_num: 6
indoor_frontier/cluster_match_radius: 1.8
indoor_frontier/sample_pillar_min_height: -0.6
indoor_frontier/sample_pillar_max_height: 2.4
indoor_frontier/sample_pillar_height_layer_num: 5
indoor_frontier/sample_pillar_min_radius: 0.8
indoor_frontier/sample_pillar_max_radius: 3.5
indoor_frontier/consider_range: 16
indoor_frontier/view_score_hard_gate_min_known_free_ratio: 0.80
