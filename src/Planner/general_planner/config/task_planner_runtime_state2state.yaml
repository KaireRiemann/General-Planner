# Tracking parameters are loaded separately; relative to this file.
tracking_config: task_planner_runtime_tracking.yaml

# Runtime navigation policy and trajectory optimization (max_vel: 4 m/s below).
# Map fusion is configured only by launch -> config/map.yaml.
# Map geometry, fusion and topology construction are configured by map.yaml.
fsm:
  # Bounded retry: zero/negative legacy limits no longer mean unlimited.
  state2state_plan_from_rest_max_failures: 5
  state2state_plan_from_rest_failure_backoff: 0.25
  state2state_clear_goal_on_plan_failure: true
  task_mode: "state2state"
  task_planner_en: true
  task_mode_topic: "/planning/navigation_task_mode"
  click_goal_en: true
  click_goal_topic: "/planning/click_goal"
  click_goal_3d_en: true
  # In composed planner_runtime, PlannerSupervisor owns the external
  # /goal_3d ingress and forwards accepted goals here.  Do not subscribe to
  # /goal_3d directly, or a 3D goal bypasses task lifecycle/command handover.
  click_goal_3d_topic: "/planning/click_goal_3d"
  click_height: 1.5
  click_yaw_en: true
  perching_surface_odom_topic: "/perching/surface_odom"
  task_timeout: 1.0
  replan_rate: 5.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true
  # Optional cloud-triggered safety replanning; periodic replanning remains active.
  perception_replan_check_en: false
  perception_replan_check_rate: 60.0
  perception_replan_check_horizon: 2.0
  perception_replan_check_dt: 0.06
  perception_replan_min_interval: 0.08
  perception_replan_consecutive_hits: 1
  perception_replan_unknown_as_occupied: false
  # In-place / near-field yaw adjustment mode (planner mode "reorient").
  # Goals arrive as PoseStamped on click_goal_topic; the quaternion yaw is
  # the rotation target, the position is clamped to a small drift around the
  # current hover point (0.0 = pure in-place rotation).
  reorient_yaw_dot_max: 1.0
  reorient_min_duration: 0.6
  reorient_position_drift_max: 0.0
  reorient_yaw_goal_tolerance: 0.05

  # Direct rest-to-rest vertical motion; x/y/yaw remain fixed.
  vertical:
    max_vel: 0.5
    max_acc: 0.5
    max_jerk: 1.0
    min_duration: 1.0
    max_duration: 60.0
    start_speed_tolerance: 0.1
    tracking_error_max: 0.3
    goal_tolerance: 0.1
    completion_timeout: 3.0
    # Allow unknown space for vertical motion; occupied cells still block it.
    unknown_as_occupied: false
  perception_replan_emergency_horizon: 0.45

general_planner:
  backup_traj_en: true
  esdf_traj_en: false
  esdf_safe_distance: 0.3
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: false
  goal_vel_en: false
  corridor_bound_dis: 2.0
  corridor_line_max_length: 2.0
  safe_corridor_line_max_length: 8.0
  iris_iter_num: 2
  ellipsoid_optimizer: classic
  ellipsoid_optimizer_fallback: false
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 8.0
  sensing_horizon: -1
  receding_dis: 5.0
  robot_r: 0.2
  frontend_astar_time_out: 0.35
  over_wall_search_en: true
  over_wall_max_climb: 3.0
  over_wall_height_step: 0.3
  over_wall_min_blocked_span: 0.8
  over_wall_min_progress_gain: 0.5
  over_wall_forward_ratio: 0.9
  dynamic_obstacle_layer:
    enable: false
    cloud_topic: "/cloud_registered"
    cloud_queue_size: 3
    odom_timeout: 0.2
    ttl: 0.35
    voxel_size: 0.20
    inflation_radius: 0.40
    line_check_step: 0.05
    max_points_per_frame: 30000
    local_half_size: [ 12, 12, 3 ]
  state2state:
    direct_line_frontend_enable: true
    topology:
      enable: true
      # This profile permits the M3 global-topology option. It does not turn
      # the option on: local-only remains the default until the user publishes
      # true on /planner/navigation/use_global_topology.
      query_capability_enable: true
      selection_topic: /planner/navigation/use_global_topology
      # Global bubble A* supplies a route; the local planner executes only the
      # collision-checked prefix inside the rolling ROG window.
      # Used as a trajectory altitude fallback, not as a topology builder setting.
      navigation_altitude: 1.5
      min_query_distance: 8.0
      local_prefix_length: 8.0
      local_boundary_margin: 0.8
      route_rejoin_max_candidates: 3
      route_deviation_requery_distance: 1.0
      route_query_min_interval: 0.5
    altitude_guard_enable: true
    altitude_band: 0.25
    altitude_escape_enable: true
    altitude_escape_band: 3.5
    over_goal_guard_enable: true
    over_goal_tolerance: 0.25
    near_goal_radius: 2.0
    accept_exp_without_backup_near_goal: true
  unknown_goal_reveal_en: true
  yaw_dot_max: 3
  # Yaw mode: 1 heading to velocity, 2 heading to goal
  yaw_mode: 1
  mpc_horizon: 15

traj_opt:
  switch:
    save_log_en: false
    # Keep per-optimization details in CSV; print only the final aggregate summary.
    print_optimizer_log: false

  boundary:
    # Runtime camera/attitude stability profile; tune against the real controller.
    max_vel: 4.0
    max_acc: 2.0
    max_jerk: 60.0
    max_omg: 2.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    # 1 for xi 2 for pos
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    # Shared LBFGS fast path for the ordinary state2state ExpTrajOpt. It is
    # representation-independent and therefore applies to both dense and
    # fixed-depth convex-hull objectives.
    lbfgs_fast_en: true
    lbfgs_mem_size: 32
    lbfgs_step_bound_en: false
    lbfgs_time_ratio_min: 0.5
    lbfgs_time_ratio_max: 2.0
    lbfgs_fast_window: 3
    lbfgs_fast_min_iterations: 10
    lbfgs_fast_consecutive: 1
    lbfgs_fast_rel_cost: 1.0e-3
    lbfgs_fast_rel_step: 2.0e-2
    lbfgs_fast_rel_penalty: 5.0e-2
    # Keep the stable fast-stop rule based on objective/decision-step/penalty
    # changes. The phase-0 raw-gradient guard is scale-sensitive under the
    # large corridor weights and otherwise prevents nearly every fast stop.
    # Continuous-time feasibility is checked independently by the certificate.
    lbfgs_fast_phase0_guards_en: false
    lbfgs_fast_rel_time: 2.0e-2
    lbfgs_fast_rel_waypoint: 2.0e-2
    lbfgs_fast_scaled_grad: 5.0e-2
    lbfgs_fast_min_step: 1.0e-8
    lbfgs_fast_penalty_tol: 1.0e-2
    lbfgs_fast_small_step_limit: 3
    # Reuse the previous successful physical MINCO solution only when it is
    # compatible with the new corridor. The fresh guide seed and cached seed
    # are evaluated with the same real objective; the cached seed wins only
    # when it improves the guide cost by at least 25%.
    lbfgs_warm_start_en: false
    lbfgs_warm_start_max_endpoint_shift: 3.0
    lbfgs_warm_start_max_waypoint_shift: 2.0
    lbfgs_warm_start_duration_blend: 0.75
    lbfgs_warm_start_cost_ratio: 0.75
    lbfgs_warm_start_gradient_ratio: 1.0
    lbfgs_warm_start_penalty_ratio: 1.0
    # Preserve the timing of the already feasible guide trajectory. The old
    # implicit 0.8 scale manufactured dynamic violations before every solve.
    guide_initial_time_scale: 1.0
    scale_factor: 1.0
    integral_reso: 15
    # Representation selection. All convex-hull formulation parameters and its
    # independent penalty weights live in the dedicated profile below.
    # Set false to run dense using only the penna_* block in this file.
    convex_hull_en: true
    convex_hull_config: "traj_opt/convex_hull/click_real_highspeed.yaml"
    smooth_eps: 0.01
    # Dense-integral-only penalty set. It is ignored by the convex-hull
    # polynomial/control-point terms whenever the profile above is active.
    penna_t: 2.0e+5
    penna_pos: 5.0e+7
    penna_vel: 1.0e+7
    penna_acc: 1.0e+7
    # penna_jerk <= 0 disables both the penalty and continuous jerk certificate.
    penna_jerk: -1.0e+5
    penna_attract: 1.0e+3
    penna_guide_path: 0.0
    guide_path_tube_radius: 0.05
    guide_path_z_tube_radius: 0.05
    guide_path_huber_delta: 0.40
    guide_path_time_gradient_en: false
    penna_guide_z_tube: 1.0e+7
    guide_z_tube_radius: 0.00
    penna_omg: 5.0e+6
    penna_thr: 2.0e+6

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 5.0e+4
    penna_ts: 1.0e+6
    penna_pos: 1.0e+8
    penna_vel: 1.0e+7
    penna_acc: 1.0e+7
    penna_jerk: -1.0e+7
    penna_guide_z_tube: 5.0e+6
    guide_z_tube_radius: 0.00
    penna_omg: 5.0e+6
    penna_thr: 2.0e+6

  esdf_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81

astar:
  map_voxel_num: [ 500, 500, 100 ]
  visual_process: false
  allow_diag: true
  # 0 DIAG; 1 MANHATTAN; 2 EUCLIDEAN
  heu_type: 2
  debug_visualization_en: false
