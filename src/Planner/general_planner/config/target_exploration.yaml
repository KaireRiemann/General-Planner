# Target-directed exploration profile.
#
# Load this after the environment/base exploration profile and before an
# optional scene overlay. Targets are independent of coverage boxes and the
# current local map window. Frontier/Topo regions grow from observations.
# Explicit exclusions, flight limits and local known-free checks still apply.

# A 2D RViz goal has z=0. Keep the current flight height unless a 3D target is
# deliberately sent by setting this true in a scene-specific overlay.
exploration/mission_mode: target
exploration/target_goal_use_message_z: false
exploration/target_heuristic_weight: 3.0
exploration/target_lateral_weight: 0.15
exploration/target_vertical_weight: 0.0
exploration/target_frontier_min_progress: 0.25
exploration/target_reached_radius: 0.50
exploration/target_direct_retry_delay: 8.0
exploration/target_cluster_shortlist: 8
exploration/target_goal_lock_remaining_margin: 1.0

# Local bridge execution. Failed candidates are deferred rather than allowing
# the task to repeatedly command a narrow or stale frontier at FSM rate.
exploration/target_local_preflight_fail_limit: 3
exploration/target_progress_detour_budget: 3
exploration/target_preflight_horizon: 8.0
exploration/target_preflight_soft_defer: 1.5
exploration/target_empty_pool_escape_wait: 2.5
exploration/target_empty_pool_unlock_count: 1
# A no-bridge condition can be transient while a new scan is fused, but must
# not leave target exploration in PLAN_TRAJ forever.  On expiry it becomes a
# safe BLOCKED hold; the map and topology remain available for the next click.
exploration/target_no_progress_timeout: 12.0
exploration/target_escape_min_progress: -1.0
exploration/target_near_goal_remaining: 15.0
exploration/target_spatial_blacklist_radius: 2.5
exploration/target_spatial_blacklist_duration: 8.0

# V2: full known routes, strict raw-local prefixes, one shared MINCO backend.
# Empty/disabled global topology always falls back to local target exploration.
# legacy restores the prior point-guide frontend; shadow only diagnoses V2.
exploration/target_route/mode: prefer_known
exploration_first_command_timeout: 15.0
exploration/target_route/query_interval: 1.0
exploration/target_route/query_budget_ms: 12.0
exploration/target_route/max_nodes: 16000
exploration/target_route/max_expansions: 4000
exploration/target_route/max_map_checks: 16000
exploration/target_route/prefix_length: 12.0
exploration/target_route/min_prefix_length: 0.75
exploration/target_route/stop_margin: 0.40
exploration/target_route/projection_radius: 1.50
exploration/target_route/progress_timeout: 12.0
exploration/target_route/cooldown: 5.0
exploration/target_route/anchor_switch_margin: 1.0

# Previous advisory guide: used by legacy/shadow only, not an extra query in V2.
exploration/target_topology_guidance_enable: true
exploration/target_topology_query_interval: 1.0
exploration/target_topology_local_prefix_length: 12.0
exploration/target_topology_goal_change_tolerance: 0.5
exploration/target_topology_anchor_min_progress: 0.5
exploration/target_topology_anchor_progress_weight: 1.0
exploration/target_topology_anchor_lateral_penalty: 0.15
exploration/target_topology_anchor_radial_penalty: 0.10
exploration/target_topology_anchor_remaining_penalty: 0.05
exploration/target_topology_anchor_expansion_bonus: 2.0
exploration/target_topology_anchor_candidate_count: 8
exploration/target_topology_anchor_query_attempts: 4
exploration/target_topology_anchor_min_route_length: 1.0
exploration/target_topology_frontier_bias: 0.80
exploration/target_topology_direct_prefix_enable: true

# Target tasks are driven by the Supervisor's RViz/click goal path. Coverage
# guidance is intentionally inactive for this mission type.
fsm/trigger_goal_sets_target: true
fsm/target_goal_topic: /planning/exploration/target_goal
fsm/target_goal_start_on_receive: false
coverage_guidance/mode: "off"
