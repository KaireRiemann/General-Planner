# EPICON Unity baseline. Native coverage uses point-cloud geometry through execution.
odometry_topic: /lidar_slam/odom
cloud_topic: /cloud_registered
fsm/cloud_odom_mode: latest_odom
fsm/latest_odom_timeout: 0.5
lidar_perception/fov_up: 30.0
lidar_perception/fov_down: -30.0
lidar_perception/lidar_pitch: 0.0
lidar_perception/fov_viewpoint_up: 28.0
lidar_perception/fov_viewpoint_down: -28.0
lidar_perception/max_ray_length: 60.0
# Indoor task volume plus a small overlapping entrance approach.
# The broad exterior yard is deliberately excluded from this indoor mission.
# These are task bounds, not a substitute for obstacle clearance checks.
box_num: 2
box_0/down: [32.0, -17.0, 0.67]
box_0/up: [42.0, 15.0, 6.5]
box_1/down: [30.5, -1.5, 0.67]
box_1/up: [32.8, 1.5, 2.8]
dynamic_bounding_box/enabled: false
dead_area_num: 0

# Indoor commissioning speed; preserve hard clearance and allow slower retries.
max_traj_len: 10.0
MaxCorridorSize: 3.5
DilateRadiusSoft: 0.6
DilateRadiusHard: 0.5
MaxVelMag: 0.5
MaxAccMag: 10.0
maxBdrMag: 10000.0
MaxTiltAngle: 0.5
MinThrust: 15.0
MaxThrust: 22.0
VehicleMass: 1.9
GravAcc: 9.8
HorizDrag: 0.7
VertDrag: 0.8
ParasDrag: 0.01
SpeedEps: 0.0001
WeightT: 2000.0
WeightSafeT: 400.0
# EPICON's five weights: position, velocity, body rate, tilt, thrust.
ChiVec: [200000.0, 15000.0, 10000.0, 100000.0, 100000.0]
SmoothingEps: 0.015
IntegralIntervs: 32
RelCostTol: 0.000001
yaw_max_vel: 4.0
DynamicVelocityEnable: false
MinSegmentVel: 0.5
TrajectoryRetryMinVel: 0.3
OpenSegmentVel: 0.5
TurnSoftVelocity: 0.5
TurnHardVelocity: 0.5
BackupMaxVel: 0.5
ReplanCommitDelay: 0.35
CommitKnownFreeSafeDistance: 0.5
NonstopTerminalVelocityEnable: false

# Coverage still publishes the shared occupancy world for subsequent tasks.
# Full-rate fusion resumes on pause/handover or in any non-coverage mode.
global_map/pointcloud_main_period: 0.5
global_map/pointcloud_tracking_period: 1.0

epicon:
  bubble_topo/bubble_min_radius: 0.61
  # Search uses the existing hard margin; corridors still prefer the soft margin.
  bubble_astar/safe_distance: 0.5
  execution/audit_period: 0.5
  execution/goal_failure_limit: 3
  execution/goal_cooldown: 5.0
  execution/goal_exclusion_radius: 0.8
  execution/stall_reselect: 8.0
  execution/stall_timeout: 40.0
