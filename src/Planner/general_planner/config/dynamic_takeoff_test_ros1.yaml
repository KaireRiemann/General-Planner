fsm:
  task_mode: "dynamic_takeoff"
  perching_surface_odom_topic: "/perching/surface_odom"
  click_goal_en: false
  click_goal_topic: "/goal"
  task_mode_topic: "/planning/task_mode"
  click_height: 1.5
  click_yaw_en: true
  task_timeout: 1.0
  replan_rate: 15.0
  dynamic_takeoff_start_delay: 4.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

general_planner:
  backup_traj_en: false
  esdf_traj_en: true
  esdf_safe_distance: 0.35
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  ellipsoid_optimizer: classic
  ellipsoid_optimizer_fallback: false
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 9.0
  sensing_horizon: -1
  receding_dis: 4.0
  robot_r: 0.2
  yaw_dot_max: 3.0
  yaw_mode: 1
  mpc_horizon: 15
  perching:
    robot_l: 0.28
    v_plus: 0.8
    pre_contact_distance: 0.55
    terminal_relax_time: 0.35
    safe_distance: 0.0
    platform_radius: 0.35
    robot_radius: 0.25
    platform_clearance: 0.05
    thrust_nominal: 9.81
    thrust_range: 2.0
    weight_nu: 1.0e-2
    weight_tau_f: 1.0e-3
    min_duration: 0.6
    max_duration: 6.5
    reference_speed: 5.0
    relative_z_min: 0.1
    relative_z_max: 3.0
    weight_relative_height: 1.0
    visual_min_distance: 0.2
    visual_activation_distance: 3.0
    visual_fx: 1.0
    visual_fy: 1.0
    terminal_pos_tolerance: 0.15
    terminal_vel_tolerance: 0.5
    contact_time_margin: 0.15
    contact_distance_tolerance: 0.12
    max_replan_fail_keep: 3
    rotate_surface_with_yaw_rate: true
    frontend_astar: true
    use_dynamics_terminal_accel: true
    contact_occupancy_allowance_enable: true
    contact_linefree_allowance_enable: true
    contact_occupancy_normal_tolerance: 0.20
    contact_occupancy_tangent_margin: 0.15
    duration_margin: 0.20
    duration_tolerance: 0.15
    allow_long_standalone: false
    time_upper_bound_weight: 5000.0
    duration_seed_weight: 50.0
    max_piece_duration: 1.2
    min_piece_num: 3
    max_piece_num: 8
    multi_point_guide_enable: true
    moving_guide_sample_num: 4
    tau_f_seed_limit: 1.30
    reset_surface_time: true
  takeoff:
    robot_l: 0.28
    robot_radius: 0.25
    platform_radius: 0.35
    platform_clearance: 0.05
    release_contact_time: 0.60
    escape_distance: 1.0
    escape_height: 0.8
    reference_speed: 1.5
    min_duration: 0.6
    max_duration: 3.0
    safe_distance: 0.35
    piece_num: 3
    frontend_astar: true
    use_tangent_release_velocity: false
    weight_eta: 1.0
    weight_tau_f: 1.0e-3
    platform_clearance_after_release: 0.08

traj_opt:
  switch:
    save_log_en: true
    print_optimizer_log: false

  boundary:
    max_vel: 7.0
    max_acc: 8.0
    max_jerk: 180.0
    max_omg: 3.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5

  esdf_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 16
    smooth_eps: 0.01
    penna_t: 12.0
    penna_pos: 500.0
    penna_vel: 500.0
    penna_acc: 500.0
    penna_jerk: 500.0
    penna_attract: 100.0
    penna_omg: 0.0
    penna_thr: 0.0

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81

astar:
  map_voxel_num: [500, 500, 100]
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false

rog_map:
  resolution: 0.1
  inflation_resolution: 0.2
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [50, 50, 6]
  fix_map_origin: [0, 0, 1.5]
  frontier_extraction_en: false
  virtual_ceil_height: 5.0
  virtual_ground_height: -0.1
  load_pcd_en: true
  pcd_name: "${CMAKE_ROOT_DIR}/../mars_uav_sim/perfect_drone_sim/pcd/perching.pcd"
  map_sliding:
    enable: true
    threshold: 0.3
  esdf:
    enable: true
    resolution: 0.2
    local_update_box: [16, 16, 4]
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0
  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [15, 15, 4]
    frame_id: "world"
    pub_unknown_map_en: false
  intensity_thresh: -10
  point_filt_num: 1
  raycasting:
    enable: false
    batch_update_size: 1
    local_update_box: [100, 100, 5]
    ray_range: [0.5, 100]
    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0
