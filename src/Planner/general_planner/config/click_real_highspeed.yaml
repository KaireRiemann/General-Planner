fsm:
  click_goal_en: true
  click_goal_topic: "/goal"
  click_goal_3d_en: true
  click_goal_3d_topic: "/goal_3d"
  click_height: 1.5
  click_yaw_en: true
  replan_rate: 15.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true
  perception_replan_check_rate: 60.0
  perception_replan_check_horizon: 2.0
  perception_replan_check_dt: 0.06
  perception_replan_min_interval: 0.08
  perception_replan_consecutive_hits: 1
  perception_replan_emergency_horizon: 0.45

general_planner:
  backup_traj_en: true
  esdf_traj_en: false
  esdf_safe_distance: 0.3
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: false
  goal_vel_en: false
  corridor_bound_dis: 2.0
  corridor_line_max_length: 2.0
  safe_corridor_line_max_length: 15.0
  iris_iter_num: 2
  ellipsoid_optimizer: classic
  ellipsoid_optimizer_fallback: false
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 15.0
  sensing_horizon: -1
  receding_dis: 8.0
  robot_r: 0.2
  frontend_astar_time_out: 0.35
  over_wall_search_en: true
  over_wall_max_climb: 3.0
  over_wall_height_step: 0.3
  over_wall_min_blocked_span: 0.8
  over_wall_min_progress_gain: 0.5
  over_wall_forward_ratio: 0.9
  dynamic_obstacle_layer:
    enable: false
    cloud_topic: "/cloud_registered"
    cloud_queue_size: 3
    odom_timeout: 0.2
    ttl: 0.35
    voxel_size: 0.20
    inflation_radius: 0.40
    line_check_step: 0.05
    max_points_per_frame: 30000
    local_half_size: [ 12, 12, 3 ]
  state2state:
    direct_line_frontend_enable: true
    topology:
      enable: false
      # Build, record and visualize only. Keep topology completely outside the
      # latency-sensitive state2state frontend.
      query_enable: false
      # State2state in this profile navigates inside a narrow inflated height
      # band. Build a 2.5D XY graph at the band's automatically derived center.
      planar_mode: true
      # frontend_in_known_free=false: allow unknown only inside the current
      # 50x50x6 m rolling ROG window; never persist unseen global space as free.
      unknown_as_free: true
      min_query_distance: 3.0
      # One region per worker tick keeps topology construction incremental and
      # prevents the map-maintenance thread from monopolizing a CPU core.
      update_budget: 1
      region_size: 4.0
      sample_spacing: 1.0
      min_clearance: 0.45
      max_clearance: 2.5
      connection_radius: 6.0
      dirty_padding: 2.5
      bubble_overlap_margin: 0.10
      max_nodes_per_region: 4
      max_bubbles_per_region: 256
      max_neighbors: 8
    altitude_guard_enable: true
    altitude_band: 0.25
    altitude_escape_enable: true
    altitude_escape_band: 3.5
    over_goal_guard_enable: true
    over_goal_tolerance: 0.25
    near_goal_radius: 2.0
    accept_exp_without_backup_near_goal: true
  unknown_goal_reveal_en: true
  yaw_dot_max: 3.0
  # Yaw mode: 1 heading to velocity, 2 heading to goal
  yaw_mode: 1
  mpc_horizon: 15


traj_opt:
  switch:
    save_log_en: false
    # Keep per-optimization details in CSV; print only the final aggregate summary.
    print_optimizer_log: false

  boundary:
    max_vel: 15.0
    max_acc: 20.0
    max_jerk: 120.0
    max_omg: 3.5
    max_tilt: 1.05
    max_acc_thr: 22.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    # 1 for xi 2 for pos
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    # Shared LBFGS fast path for the ordinary state2state ExpTrajOpt. It is
    # representation-independent and therefore applies to both dense and
    # fixed-depth convex-hull objectives.
    lbfgs_fast_en: true
    lbfgs_mem_size: 32
    lbfgs_step_bound_en: false
    lbfgs_time_ratio_min: 0.5
    lbfgs_time_ratio_max: 2.0
    lbfgs_fast_window: 3
    lbfgs_fast_min_iterations: 10
    lbfgs_fast_consecutive: 1
    lbfgs_fast_rel_cost: 1.0e-3
    lbfgs_fast_rel_step: 2.0e-2
    lbfgs_fast_rel_penalty: 5.0e-2
    # Legacy early-stop (cost/step/penalty only). Phase-0 physical/grad/stall
    # guards are kept in code but disabled: they were too strict and removed
    # the ~300ms closed-loop fast-dense speedup.
    lbfgs_fast_phase0_guards_en: false
    lbfgs_fast_rel_time: 2.0e-2
    lbfgs_fast_rel_waypoint: 2.0e-2
    lbfgs_fast_scaled_grad: 5.0e-2
    lbfgs_fast_min_step: 1.0e-8
    lbfgs_fast_penalty_tol: 1.0e-2
    lbfgs_fast_small_step_limit: 3
    # Preserve the timing of the already feasible guide trajectory. The old
    # implicit 0.8 scale manufactured dynamic violations before every solve.
    guide_initial_time_scale: 1.0
    scale_factor: 1.0
    integral_reso: 15
    # Online Bezier hull: ONE Fast LBFGS at depth-2 (less conservative than d0).
    # Flatness hull OFF for now: residual dense omg/thr (pre-flatness path).
    # Certificate is post-solve monitor only. Phase-2 / ALM are opt-in.
    convex_hull_en: true
    convex_hull_basis: 0
    # depth-2: complete online hull (4 leaves/segment); not depth-0.
    convex_hull_subdivision_depth: 2
    convex_hull_cost_version: 2
    # Rollback flatness certificate — use dense omg/thr residual sampling.
    convex_hull_flatness_en: false
    convex_hull_flatness_major_iters: 1
    convex_hull_alm_en: false
    convex_hull_alm_warm_start_en: false
    convex_hull_alm_warm_start_accuracy: 1.0e-3
    convex_hull_alm_active_set_en: false
    convex_hull_alm_active_set_margin: 0.05
    # Fixed depth-2 single solve (no Stage-A/B adaptive).
    convex_hull_adaptive_en: false
    convex_hull_refine_derivative_constraints: false
    convex_hull_alm_max_outer_iterations: 8
    convex_hull_refine_margin: 0.05
    convex_hull_derivative_refine_margin: 0.05
    convex_hull_alm_position_scale: 0.25
    convex_hull_robust_certificate_margin: 0.05
    convex_hull_alm_initial_penalty: 3.0e+5
    convex_hull_alm_penalty_growth: 5.0
    convex_hull_alm_progress_ratio: 0.5
    convex_hull_alm_constraint_tolerance: 1.0e-2
    convex_hull_alm_require_certification: false
    # Opt-in second solve — leave false for online speed.
    convex_hull_phase2_corrector_en: false
    convex_hull_stage_a_seed_refine_en: false
    convex_hull_phase2_require_certification: false
    convex_hull_phase2_top_k: 32
    convex_hull_phase2_max_constraints: 64
    convex_hull_phase2_max_outer: 3
    convex_hull_phase2_inner_tol_init: 1.0e-2
    convex_hull_phase2_inner_tol_final: 1.0e-4
    convex_hull_phase2_append_en: true
    convex_hull_phase2_multiplier_reuse_en: true
    smooth_eps: 0.01
    penna_t: 2.0e+5
    penna_pos: 5.0e+7
    penna_vel: 1.0e+7
    penna_acc: 1.0e+7
    # penna_jerk <= 0 disables both the penalty and continuous jerk certificate.
    penna_jerk: -1.0e+5
    penna_attract: 1.0e+3
    penna_guide_path: 0.0
    guide_path_tube_radius: 0.05
    guide_path_z_tube_radius: 0.05
    guide_path_huber_delta: 0.40
    guide_path_time_gradient_en: false
    penna_guide_z_tube: 1.0e+7
    guide_z_tube_radius: 0.00
    penna_omg: 5.0e+6
    penna_thr: 2.0e+6

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 5.0e+4
    penna_ts: 1.0e+6
    penna_pos: 1.0e+8
    penna_vel: 1.0e+7
    penna_acc: 1.0e+7
    penna_jerk: -1.0e+7
    penna_guide_z_tube: 5.0e+6
    guide_z_tube_radius: 0.00
    penna_omg: 5.0e+6
    penna_thr: 2.0e+6

  esdf_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81


astar:
  map_voxel_num: [ 500, 500, 100 ]
  visual_process: false
  allow_diag: true
  # 0 DIAG; 1 MANHATTAN; 2 EUCLIDEAN
  heu_type: 2
  debug_visualization_en: false


rog_map:
  resolution: 0.15
  inflation_resolution: 0.15
  inflation_step: 3
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 50,50,6 ]
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [ 0,0,1.5 ]
  frontier_extraction_en: false

  # Virtual ceil and ground
  virtual_ceil_height: 2.5
  virtual_ground_height: -0.1

  load_pcd_en: false

  map_sliding:
    enable: true
    # The minimum distance [m] to slide the map.
    threshold: 0.3

  esdf:
    enable: false
    resolution: 0.1
    # The range of esdf around the odom [m].
    local_update_box: [ 5,5,3 ]

  # If [enable = true], the ROG-Map will actively take ros topic as input.
  #  else user should call function [updateMap] to update the map.
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0


  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 2
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [ 20, 20,4 ]
    frame_id: "world"
    pub_unknown_map_en: false

  # Intensity filter for input point cloud. If the point intensity is less than this value,
  # it will be ignored (to avoid noise like dusk).
  intensity_thresh: -10
  # The temporal downsample rate for input point cloud.
  #  e.g. if set to k, the point cloud will be downsampled to 1/k.
  point_filt_num: 1

  # Probabilistc update
  raycasting:
    # if disable, the map will only maintain occupied information, and all other grid
    # will be considered as unknown.
    enable: false
    batch_update_size: 1
    local_update_box: [ 100,100,5 ]
    # The range of raycasting [m].
    ray_range: [0.5, 100 ]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # The threshold of a non-occupied inf map grid to be considered as free. [0.0-1.0]
    # for counter map, if each cell contains N cells in prob map, then only when
    # N_unk > N * unk_thresh cells are unknown, the cell will be considered as unknown.
    # example: 1) if unk_thresh is set 0.0, then once at least one cell in prob map is unknown,
    #             the cell will be considered as unknown.
    #         2) if unk_thresh is set to 1.0, then only all cells in prob map are unknown,
    #             the cell will be considered as unknown.
    # in all, 1.0 is more aggressive while 0.0 is more conservative.
    unk_thresh: 1.0
