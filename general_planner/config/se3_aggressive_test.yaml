fsm:
  task_mode: "se3_aggressive"
  click_goal_en: true
  click_goal_topic: "/goal"
  click_height: 1.5
  click_yaw_en: true
  task_timeout: 1.0
  replan_rate: 10.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

general_planner:
  backup_traj_en: false
  esdf_traj_en: true
  plain_traj_en: false
  esdf_safe_distance: 0.3
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  ellipsoid_optimizer: classic
  ellipsoid_optimizer_fallback: false
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 8.0
  sensing_horizon: -1
  receding_dis: 4.0
  robot_r: 0.2
  frontend_astar_time_out: 0.2
  over_wall_search_en: true
  over_wall_max_climb: 3.0
  over_wall_height_step: 0.3
  over_wall_min_blocked_span: 0.8
  over_wall_min_progress_gain: 0.5
  over_wall_forward_ratio: 0.9
  unknown_goal_reveal_en: true
  yaw_dot_max: 3.0
  yaw_mode: 1
  mpc_horizon: 15
  se3_aggressive:
    enable: true
    piece_num: 6
    reference_speed: 2.5
    min_duration: 1.0
    max_duration: 10.0
    horiz_half_len: 0.35
    vert_half_len: 0.12
    safe_margin: 0.05
    max_vel: 8.0
    thrust_acc_min: 4.0
    thrust_acc_max: 20.0
    body_rate_max: 5.0
    yaw_rate_max: 3.0
    weight_time: 10.0
    weight_corridor: 1.0e4
    weight_vel: 1.0e3
    weight_thrust: 1.0e3
    weight_body_rate: 1.0e3
    use_yaw: true
    yaw_heading_to_velocity: true
    use_corridor: true
    runtime_check_enable: true
    use_numeric_shape_gradient: false

traj_opt:
  switch:
    save_log_en: true
    print_optimizer_log: false
  boundary:
    max_vel: 8.0
    max_acc: 10.0
    max_jerk: 160.0
    max_omg: 5.0
    max_acc_thr: 20.0
    min_acc_thr: 4.0
    penna_margin: 0.05
  exp_traj:
    pos_constraint_type: 1
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_attract: 1.0e+3
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5
  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: 1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5
  esdf_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 18
    smooth_eps: 0.01
    init_profile_vel_ratio: 1.0
    init_duration_scale: 1.0
    penna_t: 40000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_attract: 1.0e+4
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5
  plain_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 18
    smooth_eps: 0.01
    penna_t: 40000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_attract: 1.0e+4
    penna_guide_vel: 1.0e+2
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5
  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81

astar:
  map_voxel_num: [500, 500, 100]
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false

rog_map:
  resolution: 0.1
  inflation_resolution: 0.1
  inflation_step: 1
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [50, 50, 6]
  fix_map_origin: [0, 0, 1.5]
  frontier_extraction_en: false
  virtual_ceil_height: 5.5
  virtual_ground_height: -0.1
  load_pcd_en: false
  map_sliding:
    enable: true
    threshold: 0.3
  esdf:
    enable: true
    resolution: 0.2
    local_update_box: [15, 15, 4]
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0
  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [15, 15, 4]
    frame_id: "world"
    pub_unknown_map_en: false
  intensity_thresh: -10
  point_filt_num: 1
  raycasting:
    enable: true
    batch_update_size: 1
    local_update_box: [15, 15, 4]
    ray_range: [0.5, 15]
    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0
