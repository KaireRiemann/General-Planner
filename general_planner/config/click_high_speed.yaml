fsm:
  click_goal_en: true
  click_goal_topic: "/goal"
  click_height: 2.4
  click_yaw_en: true
  replan_rate: 15.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

general_planner:
  backup_traj_en: true
  esdf_traj_en: false
  esdf_safe_distance: 0.3
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: false
  goal_vel_en: false
  corridor_bound_dis: 3.0
  corridor_line_max_length: 3.0
  safe_corridor_line_max_length: 999.0
  iris_iter_num: 2
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 50.0
  sensing_horizon: -1
  receding_dis: 25.0
  robot_r: 0.2
  frontend_astar_time_out: 1.0
  over_wall_search_en: true
  over_wall_max_climb: 3.0
  over_wall_height_step: 0.3
  over_wall_min_blocked_span: 0.8
  over_wall_min_progress_gain: 0.5
  over_wall_forward_ratio: 0.9
  unknown_goal_reveal_en: true
  unknown_goal_frontier_en: true
  frontier_reveal_min_unknown_span: 0.6
  frontier_reveal_search_radius: 18.0
  frontier_reveal_goal_weight: 1.0
  frontier_reveal_info_weight: 0.15
  frontier_reveal_dist_weight: 0.15
  frontier_reveal_switch_penalty: 1.0
  frontier_reveal_hysteresis_dist: 2.0
  frontier_reveal_max_candidates: 30
  yaw_dot_max: 3.0
  yaw_mode: 1
  mpc_horizon: 15

traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false

  boundary:
    max_vel: 15.0
    max_acc: 20.0
    max_jerk: 120.0
    max_omg: 5.0
    max_acc_thr: 25.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    init_profile_vel_ratio: 1.0
    init_duration_scale: 1.0
    penna_t: 1.0e+8
    penna_pos: 5.0e+8
    penna_vel: 5.0e+8
    penna_acc: 5.0e+8
    penna_jerk: -5.0e+11
    penna_attract: -1.0e+7
    penna_omg: 5.0e+8
    penna_thr: 5.0e+8

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1.0e+6
    penna_ts: 1.0e+7
    penna_pos: 1.0e+10
    penna_vel: 1.0e+8
    penna_acc: 1.0e+8
    penna_jerk: -1.0e+8
    penna_omg: 5.0e+8
    penna_thr: 5.0e+8

  esdf_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: 5.0e+5
    penna_omg: 5.0e+5
    penna_thr: 1.0e+5

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81

astar:
  map_voxel_num: [500, 500, 100]
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false

rog_map:
  resolution: 0.3
  inflation_resolution: 0.3
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [80, 80, 6]
  fix_map_origin: [0, 0, 1.5]
  frontier_extraction_en: true
  virtual_ceil_height: 4.5
  virtual_ground_height: -0.1
  load_pcd_en: false

  map_sliding:
    enable: true
    threshold: 0.3

  esdf:
    enable: false
    resolution: 0.1
    local_update_box: [5, 5, 3]

  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0

  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [20, 35, 5]
    frame_id: "world"
    pub_unknown_map_en: false

  intensity_thresh: -10
  point_filt_num: 1

  raycasting:
    enable: true
    batch_update_size: 1
    local_update_box: [100, 100, 5]
    ray_range: [0.5, 100]
    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0
