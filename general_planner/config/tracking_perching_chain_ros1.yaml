fsm:
  task_mode: "tracking"
  click_goal_en: false
  click_goal_topic: "/goal"
  click_height: 1.5
  click_yaw_en: true
  tracking_target_odom_topic: "/tracking/target_odom"
  tracking_target_prediction_topic: "/tracking/target_prediction"
  perching_surface_odom_topic: "/perching/surface_odom"
  tracking_use_target_prediction_path: true
  tracking_prediction_horizon: 4.0
  tracking_prediction_dt: 0.25
  tracking_prediction_use_kinodynamic: true
  tracking_prediction_accel: 3.0
  tracking_prediction_vmax: 4.0
  tracking_prediction_rho_accel: 1.0
  tracking_prediction_max_time: 0.03
  tracking_static_position_epsilon: 0.05
  tracking_static_velocity_epsilon: 0.05
  tracking_static_yaw_epsilon: 0.05
  tracking_static_replan_remaining_time: 0.8
  tracking_static_task_position_epsilon: 0.12
  tracking_static_task_velocity_epsilon: 0.10
  tracking_static_prediction_filter_velocity_epsilon: 0.08
  tracking_static_safety_check_horizon: 1.5
  tracking_static_safety_check_dt: 0.12
  tracking_static_replan_log_period: 1.0
  task_timeout: 1.0
  replan_rate: 15.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

general_planner:
  backup_traj_en: false
  esdf_traj_en: true
  esdf_safe_distance: 0.65
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  ellipsoid_optimizer: classic
  ellipsoid_optimizer_fallback: false
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 9.0
  sensing_horizon: -1
  receding_dis: 4.0
  robot_r: 0.2
  yaw_dot_max: 3.0
  # Yaw mode: 1 heading to velocity, 2 heading to goal
  yaw_mode: 1
  mpc_horizon: 15
  tracking:
    distance: 2.2
    distance_tolerance: 0.8
    distance_lower_tolerance: 0.45
    distance_upper_tolerance: 0.9
    height_offset: 0.7
    height_tolerance: 0.6
    safe_distance: 0.35
    visibility_safe_distance: 0.25
    visibility_cone_ratio: 0.12
    visibility_angle_clearance: 0.0872664626
    reacquire_distance: 6.0
    min_commit_duration: 0.8
    low_speed_velocity_threshold: 0.25
    angular_hysteresis: 0.35
    runtime_manager_enable: true
    anti_rollback_enable: true
    anti_rollback_horizon: 0.8
    anti_rollback_dt: 0.10
    anti_rollback_margin: 0.45
    keep_old_horizon: 0.6
    keep_old_safety_dt: 0.08
    keep_old_min_remaining: 0.45
    keep_old_min_speed: 0.15
    keep_old_min_displacement: 0.04
    keep_old_min_progress_ratio: 0.10
    keep_old_max_tracking_error_scale: 1.25
    max_consecutive_keep_old: 2
    no_motion_guard_enable: true
    no_motion_check_horizon: 0.35
    no_motion_min_displacement: 0.04
    no_motion_target_speed_threshold: 0.25
    commit_start_time_tolerance: 0.05
    candidate_angle_step: 0.3926990817
    candidate_radius_num: 3
    visibility_samples: 5
    fallback_relax_enable: true
    fallback_distance_tolerance_scale: 1.6
    fallback_height_tolerance_scale: 1.5
    fallback_candidate_radius_extra: 2
    fallback_candidate_angle_step_scale: 0.5
    fallback_search_horizon_scale: 1.3
    frontend_elastic_enable: true
    frontend_elastic_distance_tolerance_scale: 2.0
    frontend_elastic_height_tolerance_scale: 2.0
    frontend_partial_guide_enable: true
    frontend_partial_min_duration: 0.45
    frontend_partial_min_samples: 2
    weight_od_near: 35.0
    weight_od_far: 5.0
    weight_od_vertical: 8.0
    weight_oa: 5.0
    weight_oe: 1.0
    weight_relative_velocity: 1.0
    weight_tangent_velocity: 5.0
    weight_viewpoint_attractor: 50.0
    weight_visible_region: 3.0
    static_distance_tolerance_scale: 0.35
    static_height_tolerance_scale: 0.5
    static_tangent_weight_scale: 3.0
    static_tail_speed_epsilon: 0.08
    fov_horizontal_deg: 90.0
    fov_vertical_deg: 60.0
    fov_range: 4.0
    unknown_as_occupied: false
    use_visible_region: true
    # Keep A* enabled so blocked tracking guide segments fail instead of appending unsafe goals.
    frontend_astar: true
    use_snap: false
  perching:
    robot_l: 0.10
    v_plus: 0.8
    pre_contact_distance: 0.55
    terminal_relax_time: 0.35
    safe_distance: 0.0
    platform_radius: 0.35
    robot_radius: 0.25
    platform_clearance: 0.05
    thrust_nominal: 9.81
    thrust_range: 2.0
    weight_nu: 1.0e-2
    weight_tau_f: 1.0e-3
    min_duration: 0.6
    max_duration: 6.5
    reference_speed: 5.0
    relative_z_min: 0.1
    relative_z_max: 3.0
    weight_relative_height: 1.0
    visual_min_distance: 0.2
    visual_activation_distance: 3.0
    visual_fx: 1.0
    visual_fy: 1.0
    terminal_pos_tolerance: 0.15
    terminal_vel_tolerance: 0.5
    contact_time_margin: 0.15
    contact_distance_tolerance: 0.12
    max_replan_fail_keep: 3
    rotate_surface_with_yaw_rate: true
    frontend_astar: true
    use_dynamics_terminal_accel: true
    contact_occupancy_allowance_enable: true
    contact_linefree_allowance_enable: true
    contact_occupancy_normal_tolerance: 0.20
    contact_occupancy_tangent_margin: 0.15
    duration_margin: 0.20
    duration_tolerance: 0.15
    allow_long_standalone: false
    time_upper_bound_weight: 5000.0
    duration_seed_weight: 50.0
    max_piece_duration: 1.2
    min_piece_num: 3
    max_piece_num: 8
    multi_point_guide_enable: true
    moving_guide_sample_num: 4
    tau_f_seed_limit: 1.30
    reset_surface_time: true
  tracking_perching:
    enable: true
    auto_trigger_enable: false
    require_external_request: true

    readiness_min_distance: 0.5
    readiness_max_distance: 3.0
    readiness_max_relative_speed: 2.0
    readiness_max_lateral_speed: 1.5
    readiness_max_required_duration: 3.0
    readiness_min_prediction_time: 1.2
    readiness_hold_cycles: 3

    handover_delay: 0.0
    prefix_ratio: 0.4
    reference_speed: 2.0
    max_seed_duration: 3.0
    use_tracking_suffix: true
    stitch_prefix: true

    commit_only_after_candidate_check: true
    abort_to_tracking_enable: true


traj_opt:
  switch:
    save_log_en: true
    print_optimizer_log: false

  boundary:
    max_vel: 7.0
    max_acc: 8.0
    max_jerk: 180.0
    max_omg: 3.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    # 1 for xi 2 for pos
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg:  5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5

  esdf_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 16
    smooth_eps: 0.01
    penna_t: 12.0
    penna_pos: 500.0
    penna_vel: 500.0
    penna_acc: 500.0
    penna_jerk: 500.0
    penna_attract: 100.0
    penna_omg: 0.0
    penna_thr: 0.0

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81


astar:
  map_voxel_num: [ 500, 500, 100 ]
  visual_process: false
  allow_diag: true
  # 0 DIAG; 1 MANHATTAN; 2 EUCLIDEAN
  heu_type: 2
  debug_visualization_en: false


rog_map:
  resolution: 0.1
  inflation_resolution: 0.2
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 50,50,6 ]
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [ 0,0,1.5 ]
  frontier_extraction_en: false

  # Virtual ceil and ground
  virtual_ceil_height: 3.5
  virtual_ground_height: -0.1

  load_pcd_en: true
  pcd_name: "${CMAKE_ROOT_DIR}/../mars_uav_sim/perfect_drone_sim/pcd/perching.pcd"

  map_sliding:
    enable: true
    # The minimum distance [m] to slide the map.
    threshold: 0.3

  esdf:
    enable: true
    resolution: 0.2
    # The range of esdf around the odom [m].
    local_update_box: [ 16,16,4 ]

  # If [enable = true], the ROG-Map will actively take ros topic as input.
  #  else user should call function [updateMap] to update the map.
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0


  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 2
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [ 15, 15,4 ]
    frame_id: "world"
    pub_unknown_map_en: false

  # Intensity filter for input point cloud. If the point intensity is less than this value,
  # it will be ignored (to avoid noise like dusk).
  intensity_thresh: -10
  # The temporal downsample rate for input point cloud.
  #  e.g. if set to k, the point cloud will be downsampled to 1/k.
  point_filt_num: 1

  # Probabilistc update
  raycasting:
    # if disable, the map will only maintain occupied information, and all other grid
    # will be considered as unknown.
    enable: false
    batch_update_size: 1
    local_update_box: [ 100,100,5 ]
    # The range of raycasting [m].
    ray_range: [0.5, 100 ]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # The threshold of a non-occupied inf map grid to be considered as free. [0.0-1.0]
    # for counter map, if each cell contains N cells in prob map, then only when
    # N_unk > N * unk_thresh cells are unknown, the cell will be considered as unknown.
    # example: 1) if unk_thresh is set 0.0, then once at least one cell in prob map is unknown,
    #             the cell will be considered as unknown.
    #         2) if unk_thresh is set to 1.0, then only all cells in prob map are unknown,
    #             the cell will be considered as unknown.
    # in all, 1.0 is more aggressive while 0.0 is more conservative.
    unk_thresh: 1.0
