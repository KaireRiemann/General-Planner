fsm:
  task_mode: "tracking"
  click_goal_en: false
  click_goal_topic: "/goal"
  click_height: 1.5
  click_yaw_en: true
  tracking_target_odom_topic: "/tracking/target_odom"
  tracking_target_prediction_topic: "/tracking/target_prediction"
  tracking_use_target_prediction_path: true
  tracking_prediction_horizon: 4.0
  tracking_prediction_dt: 0.25
  tracking_prediction_use_kinodynamic: true
  tracking_prediction_accel: 3.0
  tracking_prediction_vmax: 4.0
  tracking_prediction_rho_accel: 1.0
  tracking_prediction_max_time: 0.03
  tracking_static_position_epsilon: 0.05
  tracking_static_velocity_epsilon: 0.05
  tracking_static_yaw_epsilon: 0.05
  tracking_static_replan_remaining_time: 0.8
  tracking_static_task_position_epsilon: 0.12
  tracking_static_task_velocity_epsilon: 0.10
  tracking_static_prediction_filter_velocity_epsilon: 0.08
  tracking_static_safety_check_horizon: 1.5
  tracking_static_safety_check_dt: 0.12
  tracking_static_replan_log_period: 1.0
  task_timeout: 1.0
  replan_rate: 15.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

general_planner:
  backup_traj_en: false
  esdf_traj_en: true
  esdf_safe_distance: 0.65
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 9.0
  sensing_horizon: -1
  receding_dis: 4.0
  robot_r: 0.2
  yaw_dot_max: 3.0
  # Yaw mode: 1 heading to velocity, 2 heading to goal
  yaw_mode: 1
  mpc_horizon: 15
  tracking:
    distance: 2.2
    distance_tolerance: 0.8
    height_offset: 0.7
    height_tolerance: 0.6
    safe_distance: 0.35
    visibility_safe_distance: 0.25
    visibility_cone_ratio: 0.12
    visibility_angle_clearance: 0.0872664626
    reacquire_distance: 6.0
    min_commit_duration: 0.8
    candidate_angle_step: 0.3926990817
    candidate_radius_num: 3
    visibility_samples: 5
    weight_od_near: 20.0
    weight_od_far: 5.0
    weight_od_vertical: 8.0
    weight_oa: 5.0
    weight_oe: 1.0
    weight_esdf_obstacle: 500.0
    weight_relative_velocity: 1.0
    weight_tangent_velocity: 5.0
    weight_viewpoint_attractor: 50.0
    weight_visible_region: 3.0
    frontend_score_path_weight: 1.0
    frontend_score_preferred_weight: 0.25
    frontend_score_od_weight: 6.0
    frontend_score_oe_weight: 5.0
    frontend_score_clearance_reward: 1.5
    frontend_score_source_bias_weight: 1.0
    frontend_log_en: true
    quality_gate_en: true
    quality_sample_dt: 0.1
    quality_tail_window: 1.0
    quality_min_tail_ratio: 0.75
    quality_visibility_margin: -0.05
    static_distance_tolerance_scale: 0.35
    static_height_tolerance_scale: 0.5
    static_tangent_weight_scale: 3.0
    static_tail_speed_epsilon: 0.08
    fov_horizontal_deg: 90.0
    fov_vertical_deg: 60.0
    fov_range: 4.0
    unknown_as_occupied: false
    use_corridor: false
    use_esdf_obstacle: true
    use_visible_region: true
    # Keep A* enabled so blocked tracking guide segments fail instead of appending unsafe goals.
    frontend_astar: true
    use_snap: false


traj_opt:
  switch:
    save_log_en: true
    print_optimizer_log: false

  boundary:
    max_vel: 5.0
    max_acc: 5.0
    max_jerk: 120.0
    max_omg: 2.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    # 1 for xi 2 for pos
    pos_constraint_type: 1
    piece_num: 4
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg:  5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5

  esdf_traj:
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 16
    smooth_eps: 0.01
    penna_t: 12.0
    penna_pos: 500.0
    penna_vel: 500.0
    penna_acc: 500.0
    penna_jerk: 500.0
    penna_attract: 100.0
    penna_omg: 0.0
    penna_thr: 0.0

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81


astar:
  map_voxel_num: [ 500, 500, 100 ]
  visual_process: false
  allow_diag: true
  # 0 DIAG; 1 MANHATTAN; 2 EUCLIDEAN
  heu_type: 2
  debug_visualization_en: false


rog_map:
  resolution: 0.1
  inflation_resolution: 0.2
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 50,50,6 ]
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [ 0,0,1.5 ]
  frontier_extraction_en: false

  # Virtual ceil and ground
  virtual_ceil_height: 3.5
  virtual_ground_height: -0.1

  load_pcd_en: true
  pcd_name: "${CMAKE_ROOT_DIR}/../mars_uav_sim/perfect_drone_sim/pcd/big_field.pcd"

  map_sliding:
    enable: true
    # The minimum distance [m] to slide the map.
    threshold: 0.3

  esdf:
    enable: true
    resolution: 0.2
    # The range of esdf around the odom [m].
    local_update_box: [ 16,16,4 ]

  # If [enable = true], the ROG-Map will actively take ros topic as input.
  #  else user should call function [updateMap] to update the map.
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0


  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 2
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [ 15, 15,4 ]
    frame_id: "world"
    pub_unknown_map_en: false

  # Intensity filter for input point cloud. If the point intensity is less than this value,
  # it will be ignored (to avoid noise like dusk).
  intensity_thresh: -10
  # The temporal downsample rate for input point cloud.
  #  e.g. if set to k, the point cloud will be downsampled to 1/k.
  point_filt_num: 1

  # Probabilistc update
  raycasting:
    # if disable, the map will only maintain occupied information, and all other grid
    # will be considered as unknown.
    enable: false
    batch_update_size: 1
    local_update_box: [ 100,100,5 ]
    # The range of raycasting [m].
    ray_range: [0.5, 100 ]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # The threshold of a non-occupied inf map grid to be considered as free. [0.0-1.0]
    # for counter map, if each cell contains N cells in prob map, then only when
    # N_unk > N * unk_thresh cells are unknown, the cell will be considered as unknown.
    # example: 1) if unk_thresh is set 0.0, then once at least one cell in prob map is unknown,
    #             the cell will be considered as unknown.
    #         2) if unk_thresh is set to 1.0, then only all cells in prob map are unknown,
    #             the cell will be considered as unknown.
    # in all, 1.0 is more aggressive while 0.0 is more conservative.
    unk_thresh: 1.0
