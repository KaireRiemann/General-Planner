#############| For UAV simulation |#################################
pcd_name: "perching.pcd"
mesh_resource: "package://perfect_drone_sim/meshes/yunque-M.dae"
init_position:
  x: 4.0
  y: 2.0
  z: 1.28
init_roll: 0.0
init_pitch: 0.0
init_yaw: 0.0

#############|For LiDAR perception simulation |#################################
is_360lidar: true
polar_resolution: 0.4
downsample_res: 0.1
vertical_fov: 178.0
sensing_blind: 0.1
sensing_horizon: 30
sensing_rate: 10
print_time_consumption: false
lidar_type: 2
depth_image_en: false
